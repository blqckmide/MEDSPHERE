<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MEDSPHERE Live Score</title>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #0b0f1a;
      color: white;
    }

    header {
      background: #111;
      padding: 15px;
      text-align: center;
    }

    .match {
      background: #1a2233;
      margin: 10px;
      padding: 15px;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<header>
  <h1>MEDSPHERE Live Score</h1>
</header>

<main>
  <div id="matches"></div>
</main>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "medsphere-c794d.firebaseapp.com",
  projectId: "medsphere-c794d",
  storageBucket: "medsphere-c794d.firebasestorage.app",
  messagingSenderId: "962864542783",
  appId: "1:962864542783:web:b59e6abda9c6f1a9fc348a",
  measurementId: "G-HPQ46648M4"
};

const app = firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const matchesDiv = document.getElementById("matches");

// REAL-TIME LISTENER 🔥
db.collection("matches").onSnapshot(snapshot => {
  matchesDiv.innerHTML = "";

  snapshot.forEach(doc => {
    const match = doc.data();

    const div = document.createElement("div");
    div.className = "match";

    div.innerHTML = `
      <h3>${match.teamA} vs ${match.teamB}</h3>
      <p>${match.scoreA} - ${match.scoreB}</p>
    `;

    matchesDiv.appendChild(div);
  });
});
</script>

</body>
</html>
