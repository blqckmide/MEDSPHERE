* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Barlow', sans-serif;
  background: var(--bg);
  color: var(--white);
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
  opacity: 0.6;
}

body::after {
  content: '';
  position: fixed;
  top: -20%;
  left: 50%;
  transform: translateX(-50%);
  width: 600px;
  height: 300px;
  background: radial-gradient(ellipse, rgba(220,38,38,0.08) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(7,8,16,0.9);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 0 1.25rem;
  height: 56px;
  display: flex;
  align-items: center;
  gap: 1rem;
}
.header::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  width: 3px;
  background: var(--red);
}

.logo { display: flex; align-items: baseline; gap: 2px; flex-shrink: 0; }
.logo-med    { font-family: 'Barlow Condensed', sans-serif; font-size: 1.25rem; font-weight: 900; color: var(--red); letter-spacing: 0.5px; text-transform: uppercase; }
.logo-sphere { font-family: 'Barlow Condensed', sans-serif; font-size: 1.25rem; font-weight: 900; color: var(--white); letter-spacing: 0.5px; text-transform: uppercase; }

.live-pill {
  display: inline-flex; align-items: center; gap: 5px;
  background: rgba(220,38,38,0.15); border: 1px solid rgba(220,38,38,0.4);
  color: var(--red-bright);
  font-family: 'Barlow Condensed', sans-serif; font-size: 0.65rem; font-weight: 800;
  letter-spacing: 1.5px; text-transform: uppercase;
  padding: 3px 8px; border-radius: 4px; margin-left: 6px;
  animation: pill-blink 1.2s ease-in-out infinite;
}
@keyframes pill-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
.live-pill::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--red-bright); }

.ticker-wrap {
  flex: 1; max-width: 560px; height: 30px;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 4px; display: flex; align-items: center; overflow: hidden;
}
.ticker-label {
  flex-shrink: 0; background: var(--red); height: 100%;
  display: flex; align-items: center; padding: 0 10px;
  font-family: 'Barlow Condensed', sans-serif; font-size: 0.6rem; font-weight: 800;
  letter-spacing: 2px; text-transform: uppercase;
}
.ticker-track { overflow: hidden; flex: 1; }
.ticker-move {
  display: inline-block; white-space: nowrap; padding-left: 100%;
  animation: ticker 28s linear infinite;
  font-size: 0.7rem; font-weight: 500; color: var(--muted-mid);
}
@keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

main {
  position: relative; z-index: 1;
  max-width: 620px; margin: 0 auto; padding: 0.9rem 0.75rem 2rem;
}

.match-card {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 10px; overflow: hidden; margin-bottom: 0.75rem;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4); transition: border-color 0.3s;
}
.match-card.status-LIVE {
  border-color: rgba(220,38,38,0.3);
  box-shadow: 0 8px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(220,38,38,0.1);
}
.match-card.status-LIVE .card-stripe { background: linear-gradient(90deg, var(--red) 0%, transparent 60%); }
.card-stripe { height: 2px; width: 100%; background: var(--surface-3); }
.card-body { padding: 0.65rem 1rem; }

.match-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
.stage-tag {
  font-family: 'Barlow Condensed', sans-serif; font-size: 0.65rem; font-weight: 700;
  letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted);
  background: var(--surface-3); border: 1px solid var(--border); padding: 3px 8px; border-radius: 4px;
}
.status-tag {
  font-family: 'Barlow Condensed', sans-serif; font-size: 0.65rem; font-weight: 800;
  letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted-mid);
}
.status-tag.live { color: var(--red-bright); display: flex; align-items: center; gap: 5px; }
.status-tag.live::before {
  content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--red-bright);
  animation: pulse-dot 1.2s ease-in-out infinite;
}
@keyframes pulse-dot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.7); } }

.score-section {
  display: grid; grid-template-columns: 1fr auto 1fr;
  align-items: center; gap: 8px; margin-bottom: 0.3rem;
}
.team-block { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.team-name {
  font-family: 'Barlow Condensed', sans-serif; font-size: 0.82rem; font-weight: 800;
  letter-spacing: 1px; text-transform: uppercase; text-align: center;
  color: #CBD5E1; text-shadow: 0 0 10px rgba(203,213,225,0.4);
}
.score-display { display: flex; align-items: center; gap: 6px; }
.score-num {
  font-family: 'Barlow Condensed', sans-serif; font-size: 2.1rem; font-weight: 900;
  line-height: 1; color: #FFFFFF; text-shadow: 0 0 4px rgba(255,255,255,0.15);
}
.score-sep {
  font-family: 'Barlow Condensed', sans-serif; font-size: 1.5rem; font-weight: 400;
  color: var(--muted); line-height: 1; margin-top: 1px;
}

.match-clock { text-align: center; margin-bottom: 0.5rem; }
.clock-inner {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: 'Barlow Condensed', sans-serif; font-size: 0.72rem; font-weight: 700; letter-spacing: 1px;
}
.clock-inner.live-time { color: var(--red-bright); }
.clock-inner.ended { color: var(--muted-mid); }

/* ── MOTM Block ── */
.motm-block {
  display: flex; align-items: center; gap: 10px;
  background: linear-gradient(135deg, rgba(251,191,36,0.1) 0%, rgba(251,191,36,0.04) 100%);
  border: 1px solid rgba(251,191,36,0.3); border-radius: 8px;
  padding: 9px 13px; margin-bottom: 0.6rem;
}
.motm-star {
  font-size: 1.2rem; flex-shrink: 0;
  filter: drop-shadow(0 0 8px rgba(251,191,36,0.8));
  animation: star-pulse 2s ease-in-out infinite;
}
@keyframes star-pulse { 0%,100%{transform:scale(1);filter:drop-shadow(0 0 8px rgba(251,191,36,0.8));} 50%{transform:scale(1.15);filter:drop-shadow(0 0 14px rgba(251,191,36,1));} }
.motm-info { flex: 1; min-width: 0; }
.motm-label {
  font-family: 'Barlow Condensed', sans-serif; font-size: 0.55rem; font-weight: 800;
  letter-spacing: 2px; text-transform: uppercase; color: #F59E0B; margin-bottom: 2px;
}
.motm-name {
  font-family: 'Barlow Condensed', sans-serif; font-size: 1rem; font-weight: 900;
  letter-spacing: 0.5px; color: #FFFFFF; text-shadow: 0 0 12px rgba(251,191,36,0.4);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.motm-team { font-size: 0.6rem; color: var(--muted-mid); margin-top: 1px; }

.divider { height: 1px; background: var(--border); margin: 0 -1rem; }

.tabs-bar { display: flex; padding: 0.4rem 0 0; gap: 2px; }
.tab-btn {
  flex: 1; padding: 5px 4px;
  background: transparent; border: none; border-bottom: 2px solid transparent;
  cursor: pointer;
  font-family: 'Barlow Condensed', sans-serif; font-size: 0.65rem; font-weight: 700;
  letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted);
  transition: color 0.2s, border-color 0.2s;
}
.tab-btn:hover { color: var(--muted-mid); }
.tab-btn.active { color: var(--white); border-bottom-color: var(--red); }
.tab-panel { display: none; padding-top: 0.65rem; }
.tab-panel.active { display: block; }

.stat-item { margin-bottom: 9px; }
.stat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
.stat-val { font-family: 'Barlow Condensed', sans-serif; font-size: 0.8rem; font-weight: 700; min-width: 28px; }
.stat-val.home { color: #F59E0B; text-align: left; }
.stat-val.away { color: #38BDF8; text-align: right; }
.stat-name { font-size: 0.65rem; font-weight: 600; letter-spacing: 0.5px; color: var(--muted-mid); text-align: center; flex: 1; }
.stat-bar { height: 3px; background: var(--surface-3); border-radius: 2px; display: flex; overflow: hidden; }
.bar-home { background: #F59E0B; height: 100%; transition: width 0.6s cubic-bezier(0.4,0,0.2,1); border-radius: 2px 0 0 2px; }
.bar-away { background: #38BDF8; height: 100%; transition: width 0.6s cubic-bezier(0.4,0,0.2,1); border-radius: 0 2px 2px 0; }

/* ── Pitch / Lineup ── */
.pitch-outer { width: 100%; }

/* Side-by-side team headers above each half */
.pitch-teams-row {
  display: flex;
  justify-content: space-between;

}
.pitch-team-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 0.72rem; font-weight: 800;
  letter-spacing: 1px; text-transform: uppercase;
}
.pitch-team-label.home { color: #60A5FA; }
.pitch-team-label.away { color: #F87171; }

.pitch-wrap { position: relative; width: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 8px; }
.pitch-svg { width: 100%; display: block; }

.player-dot-group { cursor: default; }
.player-circle { transition: r 0.2s; }
.player-dot-group:hover .player-circle { r: 10; }
.player-label {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
  pointer-events: none; dominant-baseline: middle; text-anchor: middle;
}

.subs-section { display: flex; gap: 12px; margin-top: 4px; }
.subs-half { flex: 1; }
.subs-title {
  font-size: 0.55rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;

}
.subs-row { display: flex; flex-wrap: wrap; gap: 4px; }
.sub-chip {
  display: inline-flex; align-items: center; gap: 4px;

}

.event-list { display: flex; flex-direction: column; gap: 6px; }

.event-team-tag.home { background: rgba(245,158,11,0.15); color: #F59E0B; border: 1px solid rgba(245,158,11,0.3); }
.event-team-tag.away { background: rgba(56,189,248,0.15); color: #38BDF8; border: 1px solid rgba(56,189,248,0.3); }

<body>

<div id="goalAlert">
  <div class="goal-main">GOAL!</div>
  <div class="goal-sub">Student Union Cup</div>
</div>

<header class="header">
  <div class="logo">
    <span class="logo-med">Med</span><span class="logo-sphere">Sphere</span>
    <span class="live-pill">Livescore</span>
  </div>
  <div class="ticker-wrap">
    <div class="ticker-label">News</div>
    <div class="ticker-track">
      <span class="ticker-move" id="tickerText">Loading latest campus sports news…</span>
    </div>
  </div>
</header>

<main id="matchDisplay">
  <div class="empty-state">
    <h2>No Matches Yet</h2>
    <p>Live scores will appear here once matches begin.</p>
  </div>
</main>

<footer class="site-footer">
  <div class="footer-text">Powered by <span>UNIMED APROKO</span></div>
</footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB8Lgw7WzFuCBw5OaYTQebQ8I4JgjuohFU",
    authDomain: "medsphere-c794d.firebaseapp.com",
    projectId: "medsphere-c794d",
    storageBucket: "medsphere-c794d.firebasestorage.app",
    messagingSenderId: "962864542783",
    appId: "1:962864542783:web:b59e6abda9c6f1a9fc348a"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  onValue(ref(db, 'globalSettings/newsTicker'), (s) => {
    document.getElementById('tickerText').textContent =
      s.val() || "Welcome to the MedSphere Student Union Cup!";
  });

  let prevScores = {};

  onValue(ref(db, 'matches'), (snap) => {
    const data = snap.val() || {};
    const container = document.getElementById('matchDisplay');

    if (!Object.keys(data).length) {
      container.innerHTML = `
        <div class="empty-state">
          <h2>No Matches Yet</h2>
          <p>Live scores will appear here once matches begin.</p>
        </div>`;
      return;
    }

    container.innerHTML = '';

    Object.entries(data).forEach(([id, m]) => {
      const total = (m.homeScore || 0) + (m.awayScore || 0);
      if (prevScores[id] !== undefined && total > prevScores[id]) triggerGoal();
      prevScores[id] = total;

      // Stats — removed totalShots, added shotsOffTarget
      const stats = m.stats || {
        possession:     { home: 50, away: 50 },
        shotsOnTarget:  { home: 0,  away: 0  },
        shotsOffTarget: { home: 0,  away: 0  },
        bigChances:     { home: 0,  away: 0  }
      };

      const isLive  = m.status === 'LIVE';
      const isEnded = m.status === 'ENDED';

      const card = document.createElement('div');
      card.className = `match-card status-${m.status}`;

      // Build events list with team tags
      const goals  = (m.scorers || []).map(s => ({ type: 'goal', name: s.name, time: s.time, team: s.team }));
      const events = [...goals].sort((a, b) => parseInt(a.time) - parseInt(b.time));

      const eventsHtml = events.length
        ? events.map(e => {
            const isHome = e.team === 'home';
            const teamName = isHome ? (m.homeTeam || 'Home') : (m.awayTeam || 'Away');
            return `<div class="event-row">
              <span class="event-icon">⚽</span>
              <span class="event-text">${esc(e.name)}</span>
              <span class="event-team-tag ${isHome ? 'home' : 'away'}">${esc(teamName)}</span>
              <span class="event-time">${e.time}'</span>
            </div>`;
          }).join('')
        : '<div class="no-events">No events recorded yet</div>';

      card.innerHTML = `
        <div class="card-stripe"></div>
        <div class="card-body">
          <div class="match-meta">
            <span class="stage-tag">${esc(m.stage || 'Group Stage')} · <span style="color:#A78BFA">6-aside</span></span>
            <span class="status-tag ${isLive ? 'live' : ''}">${isLive ? 'Live' : isEnded ? 'Full Time' : esc(m.status)}</span>
          </div>

          <div class="score-section">
            <div class="team-block home">
              <div class="team-name">${esc(m.homeTeam)}</div>
            </div>
            <div class="score-display">
              <span class="score-num">${m.homeScore || 0}</span>
              <span class="score-sep">:</span>
              <span class="score-num">${m.awayScore || 0}</span>
            </div>
            <div class="team-block away">
              <div class="team-name">${esc(m.awayTeam)}</div>
            </div>
          </div>

          <div class="match-clock">
            <div class="clock-inner ${isLive ? 'live-time' : 'ended'}">
              ${isLive ? `<span>${esc(String(m.time))}'</span>` : isEnded ? '<span>Ended</span>' : ''}
            </div>
          </div>

          ${m.motm ? `
          <div class="motm-block">
            <div class="motm-star">⭐</div>
            <div class="motm-info">
              <div class="motm-label">Player of the Match</div>
              <div class="motm-name">${esc(m.motm.name)}</div>
              ${m.motm.team ? `<div class="motm-team">${esc(m.motm.team)}</div>` : ''}
            </div>
          </div>` : ''}

          <div class="divider"></div>

          <div class="tabs-bar">
            <button class="tab-btn" onclick="switchTab(this,'stats-${id}')">Stats</button>
            <button class="tab-btn" onclick="switchTab(this,'lineup-${id}')">Lineups</button>
            <button class="tab-btn" onclick="switchTab(this,'events-${id}')">Events</button>
          </div>

          <!-- STATS: Possession, Shots on Target, Shots off Target, Big Chances -->
          <div id="stats-${id}" class="tab-panel">
            ${renderStat('Possession', stats.possession?.home ?? 50, stats.possession?.away ?? 50, '%')}
            ${renderStat('Shots on Target', stats.shotsOnTarget?.home ?? 0, stats.shotsOnTarget?.away ?? 0)}
            ${renderStat('Shots off Target', stats.shotsOffTarget?.home ?? 0, stats.shotsOffTarget?.away ?? 0)}
            ${renderStat('Big Chances', stats.bigChances?.home ?? 0, stats.bigChances?.away ?? 0)}
          </div>

          <div id="lineup-${id}" class="tab-panel">
            ${renderPitch(m.homeTeam, m.awayTeam, m.homeLineup || [], m.awayLineup || [], m.homeSubs || [], m.awaySubs || [], m.homeFormation || '', m.awayFormation || '')}
          </div>

          <div id="events-${id}" class="tab-panel">
            <div class="event-list">${eventsHtml}</div>
          </div>
        </div>
      `;
      container.appendChild(card);
    });
  });

  function esc(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])
    );
  }

  function renderStat(label, h, a, unit = '') {
    const total = (h + a) || 1;
    const hPct = (h / total * 100).toFixed(1);
    const aPct = (a / total * 100).toFixed(1);
    return `
      <div class="stat-item">
        <div class="stat-header">
          <span class="stat-val home">${h}${unit}</span>
          <span class="stat-name">${label}</span>
          <span class="stat-val away">${a}${unit}</span>
        </div>
        <div class="stat-bar">
          <div class="bar-home" style="width:${hPct}%"></div>
          <div class="bar-away" style="width:${aPct}%"></div>
        </div>
      </div>`;
  }

  window.switchTab = (btn, panelId) => {
    const card = btn.closest('.match-card');
    const panel = document.getElementById(panelId);
    const isActive = panel.classList.contains('active');
    card.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    card.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    if (!isActive) { btn.classList.add('active'); panel.classList.add('active'); }
  };

  function triggerGoal() {
    const el = document.getElementById('goalAlert');
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 3200);
  }

  // ─── Pitch Lineup Renderer — 6-aside only ───────────────────────────────────
  // Layout: home team attacks UPWARD (GK at bottom), away team attacks DOWNWARD (GK at top)
  function renderPitch(homeTeam, awayTeam, homePlayers, awayPlayers, homeSubs, awaySubs, homeFormation, awayFormation) {
    const W = 280;   // narrower
    const H = 360;   // shorter pitch

    // Position row priority (lower = closer to own goal)
    const posOrder = {
      GK: 0,
      CB: 1, RB: 1, LB: 1, LWB: 1, RWB: 1,
      CDM: 2, CM: 2, DM: 2, DMF: 2, RM: 2, LM: 2, LMF: 2, RMF: 2,
      CAM: 3, AM: 3, AMF: 3, LW: 3, RW: 3, LWF: 3, RWF: 3, SS: 3,
      ST: 4, CF: 4, FW: 4
    };

    function getRow(player) {
      const pos = (player.position || '').toUpperCase();
      for (const key of Object.keys(posOrder)) {
        if (pos.includes(key)) return posOrder[key];
      }
      return 2; // default midfield
    }

    function groupByRow(players) {
      const rows = {};
      players.forEach(p => {
        const r = getRow(p);
        if (!rows[r]) rows[r] = [];
        rows[r].push(p);
      });
      return rows;
    }

    // Place players in their half of the pitch
    // isHome=true  → home team plays in bottom half, GK near bottom
    // isHome=false → away team plays in top half, GK near top
    function placePlayers(players, colorFill, isHome) {
      if (!players.length) return '';
      const rows = groupByRow(players);
      const rowKeys = Object.keys(rows).map(Number).sort((a, b) => a - b);
      const count = rowKeys.length;

      // Each half: top=10, bottom=H/2-10
      const halfTop    = isHome ? H / 2 + 10  : 10;
      const halfBottom = isHome ? H - 10       : H / 2 - 10;
      const usable = halfBottom - halfTop;

      let dots = '';
      rowKeys.forEach((rk, ri) => {
        const group = rows[rk];
        // Home: GK row (0) → bottom; Away: GK row (0) → top
        const frac = count <= 1 ? 0.5 : ri / (count - 1);
        const y = isHome
          ? halfBottom - frac * usable   // row 0 (GK) near bottom
          : halfTop    + frac * usable;  // row 0 (GK) near top

        group.forEach((p, pi) => {
          const xFrac = group.length <= 1 ? 0.5 : pi / (group.length - 1);
          const x = 20 + xFrac * (W - 40);
          const shortName = p.name ? p.name.split(' ').pop() : '?';
          dots += `
            <g class="player-dot-group">
              <circle class="player-circle" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="11" fill="${colorFill}" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
              <text class="player-label" x="${x.toFixed(1)}" y="${(y - 0.5).toFixed(1)}" fill="#fff" font-size="8">${esc(String(p.number || ''))}</text>
              <text class="player-label" x="${x.toFixed(1)}" y="${(y + 19).toFixed(1)}" fill="rgba(255,255,255,0.78)" font-size="7">${esc(shortName)}</text>
            </g>`;
        });
      });
      return dots;
    }

    const homeDots = placePlayers(homePlayers, '#1d4ed8', true);
    const awayDots = placePlayers(awayPlayers, '#b91c1c', false);

    const noHome = !homePlayers.length;
    const noAway = !awayPlayers.length;

    // Proportional pitch markings
    const penH  = Math.round(H * 0.155);
    const sixYd = Math.round(H * 0.063);
    const penX  = Math.round(W * 0.20);
    const penW  = Math.round(W * 0.60);
    const sixX  = Math.round(W * 0.35);
    const sixW  = Math.round(W * 0.30);
    const goalX = Math.round(W * 0.375);
    const goalW = Math.round(W * 0.25);

    const pitchSvg = `
      <div class="pitch-wrap">
        <svg class="pitch-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
          <!-- background -->
          <rect width="${W}" height="${H}" fill="#1a4a2e" rx="6"/>
          ${Array.from({length: Math.ceil(H / 55)}, (_, i) =>
            `<rect x="0" y="${i * 55}" width="${W}" height="27" fill="rgba(0,0,0,0.055)"/>`
          ).join('')}
          <!-- outline -->
          <rect x="8" y="8" width="${W - 16}" height="${H - 16}" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" rx="3"/>
          <!-- halfway line -->
          <line x1="8" y1="${H / 2}" x2="${W - 8}" y2="${H / 2}" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
          <!-- centre circle -->
          <circle cx="${W / 2}" cy="${H / 2}" r="${Math.round(H * 0.072)}" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
          <circle cx="${W / 2}" cy="${H / 2}" r="2.5" fill="rgba(255,255,255,0.4)"/>
          <!-- home penalty box (bottom) -->
          <rect x="${penX}" y="${H - 8 - penH}" width="${penW}" height="${penH}" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.2"/>
          <rect x="${sixX}" y="${H - 8 - sixYd}" width="${sixW}" height="${sixYd}" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
          <rect x="${goalX}" y="${H - 8}" width="${goalW}" height="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
          <!-- away penalty box (top) -->
          <rect x="${penX}" y="8" width="${penW}" height="${penH}" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.2"/>
          <rect x="${sixX}" y="8" width="${sixW}" height="${sixYd}" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
          <rect x="${goalX}" y="0" width="${goalW}" height="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
          <!-- penalty spots -->
          <circle cx="${W / 2}" cy="${H - 8 - Math.round(penH * 0.72)}" r="2" fill="rgba(255,255,255,0.35)"/>
          <circle cx="${W / 2}" cy="${8 + Math.round(penH * 0.72)}" r="2" fill="rgba(255,255,255,0.35)"/>
          <!-- team label inside pitch (small) -->
          <text x="${W / 2}" y="${H * 0.82}" text-anchor="middle" fill="rgba(96,165,250,0.35)" font-size="8" font-family="Barlow Condensed" font-weight="800" letter-spacing="1">${esc(homeTeam.toUpperCase())}</text>
          <text x="${W / 2}" y="${H * 0.18}" text-anchor="middle" fill="rgba(248,113,113,0.35)" font-size="8" font-family="Barlow Condensed" font-weight="800" letter-spacing="1">${esc(awayTeam.toUpperCase())}</text>
          <!-- players -->
          ${noHome
            ? `<text x="${W/2}" y="${H*0.75}" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-size="9" font-family="Barlow Condensed">Lineup TBA</text>`
            : homeDots}
          ${noAway
            ? `<text x="${W/2}" y="${H*0.25}" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-size="9" font-family="Barlow Condensed">Lineup TBA</text>`
            : awayDots}
        </svg>
      </div>`;

    // Subs displayed side by side below pitch
    const subHalf = (subs, color, team) => {
      if (!subs.length) return `<div class="subs-half"><div class="subs-title" style="color:${color}">${esc(team)} — Subs</div><div class="subs-row"><span style="color:var(--muted);font-size:0.62rem">None</span></div></div>`;
      return `
        <div class="subs-half">
          <div class="subs-title" style="color:${color}">${esc(team)} — Subs</div>
          <div class="subs-row">
            ${subs.map(p => `<div class="sub-chip"><span class="sub-num" style="color:${color}">${esc(String(p.number || '–'))}</span>${esc(p.name || 'Unknown')}</div>`).join('')}
          </div>
        </div>`;
    };

    // Team name headers flush with each half
    const teamHeaders = `
      <div class="pitch-teams-row">
        <span class="pitch-team-label away">${esc(awayTeam)}</span>
        <span style="font-size:0.55rem;color:var(--muted);font-family:'Barlow Condensed',sans-serif;letter-spacing:1px">LINEUPS</span>
        <span class="pitch-team-label home">${esc(homeTeam)}</span>
      </div>`;

    const subsSection = `
      <div class="subs-section">
        ${subHalf(homeSubs, '#60A5FA', homeTeam)}
        ${subHalf(awaySubs, '#F87171', awayTeam)}
      </div>`;

    return `<div class="pitch-outer">${teamHeaders}${pitchSvg}${subsSection}</div>`;
  }
</script>
