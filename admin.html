<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | ACUMEN ACADEMY O'LEVEL</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #070810;
      --surface-1: #0C0D18;
      --surface-2: #11121F;
      --surface-3: #181928;
      --border:    rgba(255,255,255,0.07);
      --red:       #DC2626;
      --red-b:     #EF4444;
      --amber:     #F59E0B;
      --cyan:      #38BDF8;
      --green:     #4ADE80;
      --muted:     #4B5060;
      --muted-mid: #7B8096;
      --white:     #F5F6FF;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Barlow', sans-serif;
      background: var(--bg);
      color: var(--white);
      min-height: 100vh;
      font-size: 16px;
    }
    .topbar {
      position: sticky; top:0; z-index:100;
      background: rgba(7,8,16,0.95);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      height: 60px; padding: 0 1.5rem;
      display: flex; align-items: center; gap: 12px;
    }
    .topbar::before { content:''; position:absolute; left:0; top:0; height:100%; width:3px; background:var(--red); }
    .logo-med    { font-family:'Barlow Condensed',sans-serif; font-size:1.3rem; font-weight:900; color:var(--red); letter-spacing:.5px; text-transform:uppercase; }
    .logo-sphere { font-family:'Barlow Condensed',sans-serif; font-size:1.3rem; font-weight:900; color:var(--white); letter-spacing:.5px; text-transform:uppercase; }
    .admin-pill {
      font-family:'Barlow Condensed',sans-serif; font-size:0.7rem; font-weight:800;
      letter-spacing:2px; text-transform:uppercase;
      background:rgba(220,38,38,0.15); border:1px solid rgba(220,38,38,0.35);
      color:var(--red-b); padding:3px 9px; border-radius:4px;
    }
    .live { margin-left:auto; display:flex; align-items:center; gap:7px; font-size:0.8rem; color:var(--muted-mid); }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); }
    .dot.on { background:var(--green); animation:blink 1.4s infinite; }
    .dot.err { background:var(--red-b); }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.35} }

    .container { max-width:900px; margin:0 auto; padding:1.5rem 1rem 5rem; }

    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:1.25rem; }
    .stat {
      background:var(--surface-1); border:1px solid var(--border); border-radius:12px;
      padding:1rem 1.1rem; box-shadow:0 4px 24px rgba(0,0,0,0.4);
    }
    .stat-label {
      font-family:'Barlow Condensed',sans-serif; font-size:0.75rem; font-weight:800;
      letter-spacing:2px; text-transform:uppercase; color:var(--muted-mid);
    }
    .stat-val { font-family:'Barlow Condensed',sans-serif; font-size:2.4rem; font-weight:900; line-height:1.1; margin-top:4px; }

    .card {
      background:var(--surface-1); border:1px solid var(--border);
      border-radius:12px; overflow:hidden;
      box-shadow:0 4px 24px rgba(0,0,0,0.4);
    }
    .card-head {
      display:flex; align-items:center; gap:8px;
      padding:0.85rem 1.25rem;
      background:var(--surface-2); border-bottom:1px solid var(--border);
    }
    .card-head-dot { width:6px; height:6px; border-radius:50%; background:var(--red); }
    .card-head-title {
      font-family:'Barlow Condensed',sans-serif; font-size:0.8rem; font-weight:800;
      letter-spacing:2px; text-transform:uppercase; color:var(--muted-mid);
    }
    .tools { display:flex; gap:10px; padding:1rem 1.25rem 0; flex-wrap:wrap; }
    .tools input, .tools select {
      padding:10px 12px; background:var(--surface-2); border:1px solid var(--border);
      border-radius:8px; color:var(--white); font-family:'Barlow',sans-serif; font-size:0.95rem;
    }
    .tools input { flex:1; min-width:180px; }
    .tools input:focus, .tools select:focus { outline:none; border-color:rgba(220,38,38,0.5); }
    .tools select option { background:#11121F; }

    .table-wrap { overflow-x:auto; padding:1rem 1.25rem 1.25rem; }
    table { width:100%; border-collapse:collapse; }
    th {
      text-align:left; font-family:'Barlow Condensed',sans-serif; font-size:0.75rem; font-weight:800;
      letter-spacing:1.5px; text-transform:uppercase; color:var(--muted-mid);
      padding:8px 10px; border-bottom:1px solid var(--border); white-space:nowrap;
    }
    td { padding:12px 10px; border-bottom:1px solid var(--border); font-size:1rem; }
    tr:last-child td { border-bottom:none; }
    td.rank { color:var(--muted-mid); font-family:'Barlow Condensed',sans-serif; font-weight:800; width:48px; }
    td.name { font-weight:600; }
    td.score { font-family:'Barlow Condensed',sans-serif; font-weight:900; font-size:1.3rem; white-space:nowrap; }
    td.pct, td.when { color:var(--muted-mid); white-space:nowrap; font-size:0.9rem; }
    .pct-hi { color:var(--green); } .pct-mid { color:var(--amber); } .pct-lo { color:var(--red-b); }
    .empty { text-align:center; color:var(--muted); padding:2.5rem 1rem; }

    @media (max-width:640px) {
      .stats { grid-template-columns:1fr 1fr 1fr; gap:8px; }
      .stat-val { font-size:1.8rem; }
      .container { padding:1rem 0.75rem 4rem; }
    }
  </style>
</head>
<body>

<div class="topbar">
  <div><span class="logo-med">Acumen</span><span class="logo-sphere">Academy</span></div>
  <div class="admin-pill">Admin</div>
  <div class="live"><span class="dot" id="dot"></span><span id="connText">Connecting…</span></div>
</div>

<div class="container">

  <div class="stats">
    <div class="stat"><div class="stat-label">Students</div><div class="stat-val" id="stCount">0</div></div>
    <div class="stat"><div class="stat-label">Average</div><div class="stat-val" id="stAvg">–</div></div>
    <div class="stat"><div class="stat-label">Highest</div><div class="stat-val" id="stMax">–</div></div>
  </div>

  <div class="card">
    <div class="card-head"><div class="card-head-dot"></div><div class="card-head-title">ACUMEN ACADEMY O'LEVEL Results</div></div>
    <div class="tools">
      <input type="text" id="search" placeholder="Search by name…">
      <select id="sort">
        <option value="score">Highest score first</option>
        <option value="new">Newest first</option>
        <option value="name">Name A–Z</option>
      </select>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>Name</th><th>Score</th><th>%</th><th>Submitted</th></tr></thead>
        <tbody id="rows"><tr><td colspan="5" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB8Lgw7WzFuCBw5OaYTQebQ8I4JgjuohFU",
    authDomain: "medsphere-c794d.firebaseapp.com",
    projectId: "medsphere-c794d",
    storageBucket: "medsphere-c794d.firebasestorage.app",
    messagingSenderId: "962864542783",
    appId: "1:962864542783:web:b59e6abda9c6f1a9fc348a",
    measurementId: "G-HPQ46648M4"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);

  let results = [];
  const $ = id => document.getElementById(id);

  onValue(ref(db, '.info/connected'), s => {
    const on = s.val() === true;
    $('dot').className = 'dot ' + (on ? 'on' : '');
    $('connText').textContent = on ? 'Live' : 'Offline';
  });

  onValue(ref(db, 'oLevelResults'), snap => {
    const v = snap.val() || {};
    results = Object.keys(v).map(k => ({ id:k, ...v[k] }));
    render();
  }, err => {
    $('dot').className = 'dot err';
    $('connText').textContent = 'No access';
    $('rows').innerHTML = '<tr><td colspan="5" class="empty">Could not read results. Check your Firebase database rules.</td></tr>';
  });

  $('search').addEventListener('input', render);
  $('sort').addEventListener('change', render);

  function render() {
    const total = results.length;
    $('stCount').textContent = total;
    if (total) {
      const avg = results.reduce((a, r) => a + (r.score || 0), 0) / total;
      const max = Math.max(...results.map(r => r.score || 0));
      const outOf = results[0].total || 100;
      $('stAvg').textContent = avg.toFixed(1);
      $('stMax').textContent = max + '/' + outOf;
    } else {
      $('stAvg').textContent = '–';
      $('stMax').textContent = '–';
    }

    const q = $('search').value.trim().toLowerCase();
    let list = results.filter(r => (r.name || '').toLowerCase().includes(q));
    const mode = $('sort').value;
    if (mode === 'score') list.sort((a, b) => (b.score||0) - (a.score||0) || (a.submittedAt||0) - (b.submittedAt||0));
    else if (mode === 'new') list.sort((a, b) => (b.submittedAt||0) - (a.submittedAt||0));
    else list.sort((a, b) => (a.name||'').localeCompare(b.name||''));

    if (!list.length) {
      $('rows').innerHTML = `<tr><td colspan="5" class="empty">${total ? 'No names match your search.' : 'No submissions yet.'}</td></tr>`;
      return;
    }
    $('rows').innerHTML = list.map((r, i) => {
      const t = r.total || 100;
      const pct = Math.round(((r.score || 0) / t) * 100);
      const cls = pct >= 70 ? 'pct-hi' : pct >= 50 ? 'pct-mid' : 'pct-lo';
      const when = r.submittedAt ? new Date(r.submittedAt).toLocaleString([], { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) : '–';
      return `<tr>
        <td class="rank">${i + 1}</td>
        <td class="name">${esc(r.name)}</td>
        <td class="score ${cls}">${r.score ?? 0}/${t}</td>
        <td class="pct">${pct}%</td>
        <td class="when">${when}</td>
      </tr>`;
    }).join('');
  }

  function esc(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])
    );
  }
</script>

</body>
</html>
