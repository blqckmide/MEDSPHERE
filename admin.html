* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Barlow', sans-serif;
  background: var(--bg);
  color: var(--white);
  min-height: 100vh;
}

body::before {
  content:''; position:fixed; inset:0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none; z-index:0; opacity:0.6;
}

.topbar {
  position: sticky; top:0; z-index:100;
  background: rgba(7,8,16,0.95);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  height: 56px; padding: 0 1.5rem;
  display: flex; align-items: center; gap: 12px;
}
.topbar::before {
  content:''; position:absolute; left:0; top:0;
  height:100%; width:3px; background:var(--red);
}
.logo { display:flex; align-items:baseline; gap:2px; }
.logo-med    { font-family:'Barlow Condensed',sans-serif; font-size:1.2rem; font-weight:900; color:var(--red); letter-spacing:.5px; text-transform:uppercase; }
.logo-sphere { font-family:'Barlow Condensed',sans-serif; font-size:1.2rem; font-weight:900; color:var(--white); letter-spacing:.5px; text-transform:uppercase; }
.admin-pill {
  font-family:'Barlow Condensed',sans-serif; font-size:0.6rem; font-weight:800;
  letter-spacing:2px; text-transform:uppercase;
  background:rgba(220,38,38,0.15); border:1px solid rgba(220,38,38,0.35);
  color:var(--red-b); padding:3px 9px; border-radius:4px;
}
.topbar-select {
  margin-left:auto;
  background: var(--surface-2); border:1px solid var(--border);
  border-radius:8px; padding:7px 12px;
  font-family:'Barlow',sans-serif; font-size:0.82rem; color:var(--white);
  min-width:220px; cursor:pointer;
}
.topbar-select option { background:#11121F; }

.container { position:relative; z-index:1; max-width:900px; margin:0 auto; padding:1.5rem 1rem 5rem; }

.card {
  background:var(--surface-1); border:1px solid var(--border);
  border-radius:12px; overflow:hidden; margin-bottom:1.25rem;
  box-shadow:0 4px 24px rgba(0,0,0,0.4);
}
.card-head {
  display:flex; align-items:center; gap:8px;
  padding:0.85rem 1.25rem;
  background:var(--surface-2); border-bottom:1px solid var(--border);
}
.card-head-dot { width:6px; height:6px; border-radius:50%; background:var(--red); flex-shrink:0; }
.card-head-title {
  font-family:'Barlow Condensed',sans-serif; font-size:0.72rem; font-weight:800;
  letter-spacing:2px; text-transform:uppercase; color:var(--muted-mid);
}
.card-body { padding:1.25rem; }

label {
  display:block; font-size:0.6rem; font-weight:700;
  letter-spacing:0.8px; text-transform:uppercase;
  color:var(--muted-mid); margin-bottom:5px;
}
input, select {
  width:100%; padding:9px 12px;
  background:var(--surface-2); border:1px solid var(--border);
  border-radius:8px; color:var(--white);
  font-family:'Barlow',sans-serif; font-size:0.85rem;
  margin-bottom:12px; transition:border-color 0.2s;
}
input::placeholder { color:var(--muted); }
input:focus, select:focus { outline:none; border-color:rgba(220,38,38,0.5); }
select option { background:#11121F; }
input[type="number"] { -moz-appearance:textfield; }

.btn {
  display:inline-flex; align-items:center; gap:5px;
  padding:9px 18px; border:none; border-radius:8px;
  font-family:'Barlow Condensed',sans-serif; font-size:0.78rem; font-weight:800;
  letter-spacing:1px; text-transform:uppercase;
  cursor:pointer; transition:all 0.18s;
}
.btn-red   { background:var(--red); color:#fff; }
.btn-red:hover { background:#b91c1c; transform:translateY(-1px); }
.btn-ghost {
  background:var(--surface-3); color:var(--muted-mid);
  border:1px solid var(--border);
}
.btn-ghost:hover { border-color:rgba(255,255,255,0.15); color:var(--white); }
.btn-danger { background:#7f1d1d; color:#fca5a5; border:1px solid rgba(220,38,38,0.3); }
.btn-danger:hover { background:var(--red); color:#fff; }

.g2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.g3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
.g4 { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:12px; }
.row { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
.row > * { flex:1; min-width:100px; }
.row > .btn { flex:0; }

.score-editor {
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:16px;
  background:var(--surface-2); border:1px solid var(--border);
  border-radius:12px; padding:1.25rem; margin-bottom:1rem;
}
.score-team { text-align:center; }
.score-team-name {
  font-family:'Barlow Condensed',sans-serif; font-size:0.8rem; font-weight:800;
  letter-spacing:1px; text-transform:uppercase; color:var(--muted-mid); margin-bottom:8px;
}
.score-input {
  font-family:'Barlow Condensed',sans-serif; font-size:2.8rem; font-weight:900;
  text-align:center; background:transparent; border:none;
  border-bottom:2px solid var(--border); color:#fff;
  padding:4px 0; width:100%; margin-bottom:0;
  border-radius:0;
}
.score-input:focus { border-bottom-color:var(--red); outline:none; }
.score-sep {
  font-family:'Barlow Condensed',sans-serif; font-size:2rem; font-weight:400;
  color:var(--muted); text-align:center;
}

.sec {
  font-family:'Barlow Condensed',sans-serif; font-size:0.65rem; font-weight:800;
  letter-spacing:2px; text-transform:uppercase; color:var(--muted);
  padding-bottom:8px; border-bottom:1px solid var(--border); margin:1.25rem 0 1rem;
}

/* 6-aside only badge */
.formation-badge-6 {
  display:inline-block;
  font-family:'Barlow Condensed',sans-serif; font-size:0.55rem; font-weight:800;
  letter-spacing:1.5px; text-transform:uppercase;
  padding:2px 6px; border-radius:3px; margin-left:6px; vertical-align:middle;
  background:rgba(167,139,250,0.15); color:#A78BFA; border:1px solid rgba(167,139,250,0.3);
}

.pool {
  display:flex; flex-wrap:wrap; gap:5px;
  background:var(--surface-2); border:1px solid var(--border);
  border-radius:10px; padding:10px; min-height:50px; margin-bottom:10px;
}
.chip {
  display:inline-flex; align-items:center; gap:4px;
  background:var(--surface-3); border:1px solid var(--border);
  border-radius:20px; padding:4px 8px 4px 10px;
  font-size:0.7rem; color:var(--white);
}
.chip-num { font-family:'Barlow Condensed',sans-serif; font-weight:800; color:var(--cyan); font-size:0.75rem; }
.chip-pos { font-size:0.58rem; color:var(--muted-mid); background:var(--bg); border-radius:3px; padding:1px 4px; }
.chip-rm  { background:none; border:none; color:var(--red-b); cursor:pointer; font-size:0.68rem; padding:0 2px; }
.chip-rm:hover { color:#fff; }

.ev-box {
  background:var(--surface-2); border:1px solid var(--border);
  border-radius:10px; padding:10px 14px; margin-bottom:8px;
}
.ev-label { font-size:0.62rem; font-weight:700; text-transform:uppercase; letter-spacing:0.8px; color:var(--muted-mid); }
.ev-tags { display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
.ev-tag {
  background:var(--surface-3); border:1px solid var(--border);
  border-radius:20px; padding:3px 10px; font-size:0.68rem; color:var(--muted-mid);
}

.lineup-wrap { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.lineup-col h4 {
  font-family:'Barlow Condensed',sans-serif; font-size:0.7rem; font-weight:800;
  letter-spacing:1px; text-transform:uppercase; color:var(--muted-mid); margin-bottom:4px;
}
.lineup-hint {
  font-size:0.58rem; color:var(--violet); background:rgba(167,139,250,0.1);
  border:1px solid rgba(167,139,250,0.2); border-radius:4px;
  padding:3px 8px; margin-bottom:8px; display:inline-block;
}
.sub-lbl { font-size:0.6rem; font-weight:700; text-transform:uppercase; letter-spacing:0.8px; color:var(--muted); margin:10px 0 6px; }

hr { border:none; border-top:1px solid var(--border); margin:1rem 0; }

.ticker-row { display:flex; gap:10px; align-items:flex-end; }
.ticker-row > div { flex:1; }

@media (max-width:640px) {
  .g2,.g3,.g4,.lineup-wrap { grid-template-columns:1fr; }
  .container { padding:1rem 0.75rem 4rem; }
}

<div class="topbar">
  <div class="logo"><span class="logo-med">Med</span><span class="logo-sphere">Sphere</span></div>
  <div class="admin-pill">Admin</div>

<div class="container">

  <!-- 1. TICKER -->

  <div class="card">
    <div class="card-head"><div class="card-head-dot"></div><div class="card-head-title">News Ticker</div></div>
    <div class="card-body">
      <div class="ticker-row">
        <div>
          <label>Ticker Message</label>
          <input type="text" id="tickerInput" placeholder="Type the scrolling news text…" style="margin-bottom:0">
        </div>
        <button class="btn btn-red" onclick="saveTicker()">Update</button>
      </div>
    </div>
  </div>

  <!-- 2. CREATE MATCH -->

  <div class="card">
    <div class="card-head"><div class="card-head-dot"></div><div class="card-head-title">Create New Match</div></div>
    <div class="card-body">
      <div class="g3">
        <div><label>Home Team</label><input type="text" id="newHomeTeam" placeholder="Home team name" style="margin-bottom:0"></div>
        <div><label>Away Team</label><input type="text" id="newAwayTeam" placeholder="Away team name" style="margin-bottom:0"></div>
        <div style="display:flex;align-items:flex-end;"><button class="btn btn-red" style="width:100%" onclick="createMatch()">Create Match</button></div>
      </div>

  <!-- 3. LIVE CONTROLS -->

  <div class="card" id="liveControlsCard">
    <div class="card-head"><div class="card-head-dot" style="background:var(--red-b);animation:blink 1.2s infinite"></div><div class="card-head-title">⚡ Live Controls</div></div>
    <div class="card-body" id="liveControls">
      <p style="color:var(--muted);font-size:0.85rem">Select a match from the top bar.</p>

  <!-- 4. STATS -->

  <div class="card">
    <div class="card-head"><div class="card-head-dot"></div><div class="card-head-title">📊 Match Stats</div></div>
    <div class="card-body" id="statsPanel">
      <p style="color:var(--muted);font-size:0.85rem">Select a match to edit stats.</p>

    <div class="card-head"><div class="card-head-dot"></div><div class="card-head-title">⚽ Match Events</div></div>

      <p style="color:var(--muted);font-size:0.85rem">Select a match to log events.</p>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
  import { getDatabase, ref, set, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB8Lgw7WzFuCBw5OaYTQebQ8I4JgjuohFU",
    authDomain: "medsphere-c794d.firebaseapp.com",
    projectId: "medsphere-c794d",
    storageBucket: "medsphere-c794d.firebasestorage.app",
    messagingSenderId: "962864542783",
    appId: "1:962864542783:web:b59e6abda9c6f1a9fc348a",
    measurementId: "G-HPQ46648M4"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);

  onValue(ref(db, 'globalSettings/newsTicker'), s => {
    document.getElementById('tickerInput').value = s.val() || '';
  });
  window.saveTicker = () => {
    set(ref(db, 'globalSettings/newsTicker'), document.getElementById('tickerInput').value);
    flash('Ticker updated!');
  };

  let matches = {};
  let cid     = null;

  const positions = ['GK','LB','CB','RB','LWB','RWB','DMF','CMF','AMF','LMF','RMF','LWF','RWF','SS','CF'];

  // ── 6-aside formations ONLY (1 GK + 6 = 7 total per team) ──
  const formations6 = [
    '1-2-2 (6-aside)',
    '1-3-1 (6-aside)',
    '1-2-1-1 (6-aside)',
    '1-1-3 (6-aside)',
    '2-3 (6-aside)',
    '1-4 (6-aside)',
    '2-2-1 (6-aside)'
  ];

  function buildFormationOptions(current) {
    return formations6.map(f => `<option value="${f}" ${current === f ? 'selected' : ''}>${f}</option>`).join('');
  }

  onValue(ref(db, 'matches'), snap => {
    matches = snap.val() || {};
    const sel = document.getElementById('matchSelect');
    const ids = Object.keys(matches);
    sel.innerHTML = ids.map(id =>
      `<option value="${id}">${matches[id].homeTeam} vs ${matches[id].awayTeam}</option>`
    ).join('') || '<option value="">No matches</option>';

    if (ids.length && (!cid || !matches[cid])) { cid = ids[0]; sel.value = cid; }
    else if (cid && matches[cid]) sel.value = cid;

    if (cid && matches[cid]) renderAll(cid);
  });

  document.getElementById('matchSelect').addEventListener('change', e => {
    if (e.target.value) { cid = e.target.value; renderAll(cid); }
  });

  function renderAll(id) {
    renderLiveControls(id);
    renderStats(id);
    renderEvents(id);
    renderLineup(id);
    renderLog(id);
  }

  function renderLiveControls(id) {
    const m = matches[id]; if (!m) return;
    const H = esc(m.homeTeam), A = esc(m.awayTeam);
    const allPlayers = [
      ...(m.homeLineup||[]).map(p=>({...p,team:'home'})),
      ...(m.awayLineup||[]).map(p=>({...p,team:'away'})),
      ...(m.homeSubs||[]).map(p=>({...p,team:'home'})),
      ...(m.awaySubs||[]).map(p=>({...p,team:'away'})),
    ];

    document.getElementById('liveControls').innerHTML = `
      <div class="score-editor">
        <div class="score-team">
          <div class="score-team-name">${H}</div>
          <input class="score-input" type="number" id="editHomeScore" value="${m.homeScore||0}">
        </div>
        <div class="score-sep">:</div>
        <div class="score-team">
          <div class="score-team-name">${A}</div>
          <input class="score-input" type="number" id="editAwayScore" value="${m.awayScore||0}">
        </div>
      </div>

      <div class="g3" style="margin-bottom:10px">
        <div>
          <label>Status</label>
          <select id="editStatus" style="margin-bottom:0">
            <option ${m.status==='LIVE'?'selected':''}>LIVE</option>
            <option ${m.status==='ENDED'?'selected':''}>ENDED</option>
            <option ${m.status==='UPCOMING'?'selected':''}>UPCOMING</option>
          </select>
        </div>
        <div>
          <label>Match Time / Minute</label>
          <input type="text" id="editTime" placeholder="e.g. 20, HT, FT" value="${esc(m.time||'')}" style="margin-bottom:0">
        </div>
        <div>
          <label>Stage</label>
          <input type="text" id="editStage" placeholder="Group Stage, Final…" value="${esc(m.stage||'')}" style="margin-bottom:0">
        </div>
      </div>
      <button class="btn btn-red" onclick="updateMatch()" style="margin-bottom:1.25rem">💾 Save Match</button>

      <div class="sec">
        Formations
        <span style="font-size:0.58rem;color:var(--violet);font-weight:600;letter-spacing:0;text-transform:none;margin-left:8px">— 6-aside (GK + 6 outfield = 7 players)</span>
      </div>
      <div class="g2">
        <div>
          <label>${H} Formation <span class="formation-badge-6">6-aside</span></label>
          <select id="editHomeFormation" style="margin-bottom:0">${buildFormationOptions(m.homeFormation)}</select>
        </div>
        <div>
          <label>${A} Formation <span class="formation-badge-6">6-aside</span></label>
          <select id="editAwayFormation" style="margin-bottom:0">${buildFormationOptions(m.awayFormation)}</select>
        </div>
      </div>

      <div class="sec">Player of the Match ⭐</div>
      <div class="row">
        <select id="motmSelect" style="margin-bottom:0">
          <option value="">— Select player —</option>
          ${allPlayers.map(p=>`<option value="${esc(p.name)}" ${m.manOfTheMatch===p.name?'selected':''}>${p.number}. ${esc(p.name)} (${p.position}) — ${p.team==='home'?H:A}</option>`).join('')}
        </select>
        <button class="btn btn-ghost" onclick="setMotm()">Set POTM</button>
      </div>

      <hr>
      <button class="btn btn-danger" onclick="deleteMatch()">🗑️ Delete Match</button>
    `;
  }

  function renderStats(id) {
    const m = matches[id]; if (!m) return;
    const H = esc(m.homeTeam), A = esc(m.awayTeam);
    const s = m.stats || {
      possession:     { home:50, away:50 },
      shotsOnTarget:  { home:0,  away:0  },
      shotsOffTarget: { home:0,  away:0  },
      bigChances:     { home:0,  away:0  }
    };

    document.getElementById('statsPanel').innerHTML = `
      <div class="sec">Possession (%)</div>
      <div class="g2">
        <div><label>${H}</label><input type="number" id="homePoss" value="${s.possession?.home??50}" style="margin-bottom:0"></div>
        <div><label>${A}</label><input type="number" id="awayPoss" value="${s.possession?.away??50}" style="margin-bottom:0"></div>
      </div>
      <div class="sec">Shots on Target</div>
      <div class="g2">
        <div><label>${H}</label><input type="number" id="homeSOT" value="${s.shotsOnTarget?.home??0}" style="margin-bottom:0"></div>
        <div><label>${A}</label><input type="number" id="awaySOT" value="${s.shotsOnTarget?.away??0}" style="margin-bottom:0"></div>
      </div>
      <div class="sec">Shots off Target</div>
      <div class="g2">
        <div><label>${H}</label><input type="number" id="homeSOFF" value="${s.shotsOffTarget?.home??0}" style="margin-bottom:0"></div>
        <div><label>${A}</label><input type="number" id="awaySOFF" value="${s.shotsOffTarget?.away??0}" style="margin-bottom:0"></div>
      </div>
      <div class="sec">Big Chances</div>
      <div class="g2">
        <div><label>${H}</label><input type="number" id="homeBig" value="${s.bigChances?.home??0}" style="margin-bottom:0"></div>
        <div><label>${A}</label><input type="number" id="awayBig" value="${s.bigChances?.away??0}" style="margin-bottom:0"></div>
      </div>
      <br>
      <button class="btn btn-red" onclick="updateStats()">💾 Save Stats</button>
    `;
  }

  function renderEvents(id) {
    const m = matches[id]; if (!m) return;
    const H = esc(m.homeTeam), A = esc(m.awayTeam);
    const teamOpts = `<option value="home">${H}</option><option value="away">${A}</option>`;

    document.getElementById('eventsPanel').innerHTML = `
      <div class="sec">⚽ Add Goal</div>
      <div class="g2">
        <div>
          <label>Scorer Name</label>
          <input type="text" id="scorerName" placeholder="Player name">
          <label>Assist (optional)</label>
          <input type="text" id="scorerAssist" placeholder="Assisting player" style="margin-bottom:0">
        </div>
        <div>
          <label>Minute</label>
          <input type="text" id="scorerTime" placeholder="e.g. 23">
          <label>Team that scored</label>
          <select id="scorerTeam" style="margin-bottom:0">${teamOpts}</select>
        </div>
      </div>
      <button class="btn btn-red" onclick="addGoal()" style="margin-top:10px">Add Goal</button>

      <div class="sec">🟨 Yellow Card</div>
      <div class="row">
        <div><label>Player</label><input type="text" id="yellowPlayer" placeholder="Player name" style="margin-bottom:0"></div>
        <div><label>Minute</label><input type="text" id="yellowTime" placeholder="e.g. 55" style="margin-bottom:0"></div>
        <div><label>Team</label><select id="yellowTeam" style="margin-bottom:0">${teamOpts}</select></div>
        <button class="btn btn-ghost" onclick="addYellow()">Add</button>
      </div>

      <div class="sec">🟥 Red Card</div>
      <div class="row">
        <div><label>Player</label><input type="text" id="redPlayer" placeholder="Player name" style="margin-bottom:0"></div>
        <div><label>Minute</label><input type="text" id="redTime" placeholder="e.g. 72" style="margin-bottom:0"></div>
        <div><label>Team</label><select id="redTeam" style="margin-bottom:0">${teamOpts}</select></div>
        <button class="btn btn-ghost" onclick="addRed()">Add</button>
      </div>
    `;
  }

  function renderLineup(id) {
    const m = matches[id]; if (!m) return;
    const homeLineup = (m.homeLineup||[]).filter(p=>p&&p.name);
    const awayLineup = (m.awayLineup||[]).filter(p=>p&&p.name);
    const homeSubs   = (m.homeSubs||[]).filter(p=>p&&p.name);
    const awaySubs   = (m.awaySubs||[]).filter(p=>p&&p.name);
    const H = esc(m.homeTeam), A = esc(m.awayTeam);
    const posOpts = positions.map(p=>`<option>${p}</option>`).join('');

    const playerChips = (list, team, isSub) => list.map(p=>`
      <div class="chip">
        <span class="chip-num">${esc(String(p.number||''))}</span>
        ${esc(p.name)}
        <span class="chip-pos">${esc(p.position||'')}</span>
        <button class="chip-rm" onclick="${isSub?'removeSub':'removePlayer'}('${team}','${esc(p.name)}')">✕</button>
      </div>`).join('') || `<span style="color:var(--muted);font-size:0.72rem">None yet</span>`;

    document.getElementById('lineupPanel').innerHTML = `
      <div class="lineup-wrap">
        <div class="lineup-col">
          <h4>🏠 ${H}</h4>
          <div class="lineup-hint">6-aside · GK + 6 outfield = 7 players</div>
          <div class="pool">${playerChips(homeLineup,'home',false)}</div>
          <div class="row" style="flex-wrap:nowrap;gap:6px">
            <div style="flex:0;min-width:55px"><label>#</label><input type="number" id="homePlayerNum" placeholder="#" style="margin-bottom:0"></div>
            <div><label>Name</label><input type="text" id="homePlayerName" placeholder="Name" style="margin-bottom:0"></div>
            <div style="flex:0;min-width:80px"><label>Pos</label><select id="homePlayerPos" style="margin-bottom:0">${posOpts}</select></div>
            <button class="btn btn-ghost" onclick="addPlayer('home')" style="padding:9px 12px">+</button>
          </div>
          <div class="sub-lbl">Substitutes</div>
          <div class="pool">${playerChips(homeSubs,'home',true)}</div>
          <div class="row" style="flex-wrap:nowrap;gap:6px">
            <div style="flex:0;min-width:55px"><label>#</label><input type="number" id="homeSubNum" placeholder="#" style="margin-bottom:0"></div>
            <div><label>Name</label><input type="text" id="homeSubName" placeholder="Name" style="margin-bottom:0"></div>
            <div style="flex:0;min-width:80px"><label>Pos</label><select id="homeSubPos" style="margin-bottom:0">${posOpts}</select></div>
            <button class="btn btn-ghost" onclick="addSub('home')" style="padding:9px 12px">+</button>
          </div>
        </div>

        <div class="lineup-col">
          <h4>✈️ ${A}</h4>
          <div class="lineup-hint">6-aside · GK + 6 outfield = 7 players</div>
          <div class="pool">${playerChips(awayLineup,'away',false)}</div>
          <div class="row" style="flex-wrap:nowrap;gap:6px">
            <div style="flex:0;min-width:55px"><label>#</label><input type="number" id="awayPlayerNum" placeholder="#" style="margin-bottom:0"></div>
            <div><label>Name</label><input type="text" id="awayPlayerName" placeholder="Name" style="margin-bottom:0"></div>
            <div style="flex:0;min-width:80px"><label>Pos</label><select id="awayPlayerPos" style="margin-bottom:0">${posOpts}</select></div>
            <button class="btn btn-ghost" onclick="addPlayer('away')" style="padding:9px 12px">+</button>
          </div>
          <div class="sub-lbl">Substitutes</div>
          <div class="pool">${playerChips(awaySubs,'away',true)}</div>
          <div class="row" style="flex-wrap:nowrap;gap:6px">
            <div style="flex:0;min-width:55px"><label>#</label><input type="number" id="awaySubNum" placeholder="#" style="margin-bottom:0"></div>
            <div><label>Name</label><input type="text" id="awaySubName" placeholder="Name" style="margin-bottom:0"></div>
            <div style="flex:0;min-width:80px"><label>Pos</label><select id="awaySubPos" style="margin-bottom:0">${posOpts}</select></div>
            <button class="btn btn-ghost" onclick="addSub('away')" style="padding:9px 12px">+</button>
          </div>
        </div>
      </div>
    `;
  }

  function renderLog(id) {
    const m = matches[id]; if (!m) return;
    const H = esc(m.homeTeam), A = esc(m.awayTeam);

    document.getElementById('logPanel').innerHTML = `
      <div class="ev-box">
        <div class="ev-label">⚽ Goals</div>
        <div class="ev-tags">
          ${(m.scorers||[]).map(s=>`<div class="ev-tag">${esc(s.name)} ${s.time}' — ${s.team==='home'?`<span style="color:#F59E0B">${H}</span>`:`<span style="color:#38BDF8">${A}</span>`}${s.assist?` · assist: ${esc(s.assist)}`:''}</div>`).join('')||'<span style="color:var(--muted)">None</span>'}
        </div>
      </div>
      <div class="ev-box">
        <div class="ev-label">🟨 Yellow Cards</div>
        <div class="ev-tags">
          ${(m.yellowCards||[]).map(c=>`<div class="ev-tag">${esc(c.player)} ${c.time}' (${c.team==='home'?H:A})</div>`).join('')||'<span style="color:var(--muted)">None</span>'}
        </div>
      </div>
      <div class="ev-box">
        <div class="ev-label">🟥 Red Cards</div>
        <div class="ev-tags">
          ${(m.redCards||[]).map(c=>`<div class="ev-tag">${esc(c.player)} ${c.time}' (${c.team==='home'?H:A})</div>`).join('')||'<span style="color:var(--muted)">None</span>'}
        </div>
      </div>
    `;
  }

  // ── Write functions ──────────────────────────────────────────────────────────

  window.updateMatch = async () => {
    await update(ref(db,`matches/${cid}`), {
      homeScore:     parseInt(document.getElementById('editHomeScore').value),
      awayScore:     parseInt(document.getElementById('editAwayScore').value),
      status:        document.getElementById('editStatus').value,
      time:          document.getElementById('editTime').value,
      stage:         document.getElementById('editStage').value,
      homeFormation: document.getElementById('editHomeFormation').value,
      awayFormation: document.getElementById('editAwayFormation').value,
    });
    flash('Match saved!');
  };

  window.updateStats = async () => {
    await update(ref(db,`matches/${cid}`), {
      stats: {
        possession:     { home:+document.getElementById('homePoss').value,  away:+document.getElementById('awayPoss').value },
        shotsOnTarget:  { home:+document.getElementById('homeSOT').value,   away:+document.getElementById('awaySOT').value },
        shotsOffTarget: { home:+document.getElementById('homeSOFF').value,  away:+document.getElementById('awaySOFF').value },
        bigChances:     { home:+document.getElementById('homeBig').value,   away:+document.getElementById('awayBig').value },
      }
    });
    flash('Stats saved!');
  };

  window.setMotm = async () => {
    const val = document.getElementById('motmSelect').value;
    const m = matches[cid];
    const all = [
      ...(m.homeLineup||[]).map(p=>({...p,team:'home'})),
      ...(m.awayLineup||[]).map(p=>({...p,team:'away'})),
      ...(m.homeSubs||[]).map(p=>({...p,team:'home'})),
      ...(m.awaySubs||[]).map(p=>({...p,team:'away'}))
    ];
    const player = all.find(p => p.name === val);
    await update(ref(db,`matches/${cid}`), {
      motm: val ? { name: val, team: player ? (player.team === 'home' ? m.homeTeam : m.awayTeam) : '' } : null,
      manOfTheMatch: val || null
    });
    flash('Player of the Match set! ⭐');
  };

  window.addGoal = async () => {
    const name   = document.getElementById('scorerName').value.trim();
    const min    = document.getElementById('scorerTime').value.trim();
    const assist = document.getElementById('scorerAssist').value.trim();
    const team   = document.getElementById('scorerTeam').value;
    if (!name || !min) return flash('Enter scorer name and minute', 'err');
    const scorers = [...(matches[cid].scorers || [])];
    const e = { name, time: min, team };
    if (assist) e.assist = assist;
    scorers.push(e);
    await update(ref(db,`matches/${cid}`), { scorers });
    ['scorerName','scorerTime','scorerAssist'].forEach(id => document.getElementById(id).value = '');
    flash('Goal added!');
  };

  window.addYellow = async () => {
    const player = document.getElementById('yellowPlayer').value.trim();
    const min    = document.getElementById('yellowTime').value.trim();
    const team   = document.getElementById('yellowTeam').value;
    if (!player || !min) return flash('Enter name and minute', 'err');
    const cards = [...(matches[cid].yellowCards || [])];
    cards.push({ player, time: min, team });
    await update(ref(db,`matches/${cid}`), { yellowCards: cards });
    ['yellowPlayer','yellowTime'].forEach(id => document.getElementById(id).value = '');
    flash('Yellow card logged!');
  };

  window.addRed = async () => {
    const player = document.getElementById('redPlayer').value.trim();
    const min    = document.getElementById('redTime').value.trim();
    const team   = document.getElementById('redTeam').value;
    if (!player || !min) return flash('Enter name and minute', 'err');
    const cards = [...(matches[cid].redCards || [])];
    cards.push({ player, time: min, team });
    await update(ref(db,`matches/${cid}`), { redCards: cards });
    ['redPlayer','redTime'].forEach(id => document.getElementById(id).value = '');
    flash('Red card logged!');
  };

  window.addPlayer = async (team) => {
    const num  = document.getElementById(`${team}PlayerNum`).value.trim();
    const name = document.getElementById(`${team}PlayerName`).value.trim();
    const pos  = document.getElementById(`${team}PlayerPos`).value;
    if (!num || !name) return flash('Enter # and name', 'err');
    const key = team === 'home' ? 'homeLineup' : 'awayLineup';
    const cur = [...(matches[cid][key] || [])];
    cur.push({ number: num, name, position: pos });
    await update(ref(db,`matches/${cid}`), { [key]: cur });
    document.getElementById(`${team}PlayerNum`).value = '';
    document.getElementById(`${team}PlayerName`).value = '';
  };

  window.removePlayer = async (team, playerName) => {
    const key = team === 'home' ? 'homeLineup' : 'awayLineup';
    const updated = (matches[cid][key] || []).filter(p => p.name !== playerName);
    await update(ref(db,`matches/${cid}`), { [key]: updated });
  };

  window.addSub = async (team) => {
    const num  = document.getElementById(`${team}SubNum`).value.trim();
    const name = document.getElementById(`${team}SubName`).value.trim();
    const pos  = document.getElementById(`${team}SubPos`).value;
    if (!num || !name) return flash('Enter # and name', 'err');
    const key = team === 'home' ? 'homeSubs' : 'awaySubs';
    const cur = [...(matches[cid][key] || [])];
    cur.push({ number: num, name, position: pos });
    await update(ref(db,`matches/${cid}`), { [key]: cur });
    document.getElementById(`${team}SubNum`).value = '';
    document.getElementById(`${team}SubName`).value = '';
  };

  window.removeSub = async (team, playerName) => {
    const key = team === 'home' ? 'homeSubs' : 'awaySubs';
    const updated = (matches[cid][key] || []).filter(p => p.name !== playerName);
    await update(ref(db,`matches/${cid}`), { [key]: updated });
  };

  window.deleteMatch = async () => {
    if (!confirm('Permanently delete this match?')) return;
    await remove(ref(db, `matches/${cid}`));
    flash('Match deleted.');
  };

  window.createMatch = async () => {
    const home = document.getElementById('newHomeTeam').value.trim();
    const away = document.getElementById('newAwayTeam').value.trim();
    if (!home || !away) return flash('Enter both team names', 'err');
    const newRef = push(ref(db, 'matches'));
    await set(newRef, {
      homeTeam: home, awayTeam: away, homeScore: 0, awayScore: 0,
      scorers: [], yellowCards: [], redCards: [],
      homeLineup: [], awayLineup: [], homeSubs: [], awaySubs: [],
      status: 'UPCOMING', time: '--', stage: 'Group Stage',
      homeFormation: '1-2-2 (6-aside)', awayFormation: '1-2-2 (6-aside)',
      stats: {
        possession:     { home: 50, away: 50 },
        shotsOnTarget:  { home: 0,  away: 0  },
        shotsOffTarget: { home: 0,  away: 0  },
        bigChances:     { home: 0,  away: 0  }
      }
    });
    document.getElementById('newHomeTeam').value = '';
    document.getElementById('newAwayTeam').value = '';
    flash('Match created!');
  };

  // ── Utilities ────────────────────────────────────────────────────────────────

  function flash(msg, type = 'ok') {
    let t = document.getElementById('_toast');
    if (!t) {
      t = document.createElement('div');
      t.id = '_toast';
      Object.assign(t.style, {
        position: 'fixed', bottom: '24px', left: '50%', transform: 'translateX(-50%)',
        fontFamily: "'Barlow Condensed',sans-serif", fontWeight: '800',
        fontSize: '0.78rem', letterSpacing: '1px', textTransform: 'uppercase',
        padding: '10px 24px', borderRadius: '8px', zIndex: '9999',
        boxShadow: '0 8px 32px rgba(0,0,0,0.5)'
      });
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.display = 'block';
    t.style.background = type === 'err' ? '#7f1d1d' : '#14532d';
    t.style.border = `1px solid ${type === 'err' ? 'rgba(220,38,38,0.4)' : 'rgba(74,222,128,0.3)'}`;
    t.style.color = type === 'err' ? '#fca5a5' : '#86efac';
    clearTimeout(t._to);
    t._to = setTimeout(() => { t.style.display = 'none'; }, 2200);
  }

  function esc(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])
    );
  }
</script>

</body>
</html>
